<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Games</title>
    <style>
        /* Ensures the container takes up the full viewport */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Full-screen iframe styling */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://poki.com/" 
        title="Poki Games"
        allow="fullscreen; autoplay; gamepad"
        loading="lazy">
        <p>Your browser does not support iframes. Please visit <a href="https://poki.com/">Poki</a>.</p>
    </iframe>

</body>
</html>
