<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment</title>
    <style>
        /* Full-screen setup */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #111;
        }

        /* Iframe covers the entire viewport */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://duck.tinyexams.com/" 
        title="Assessment Content"
        allow="fullscreen; autoplay; gamepad; keyboard; clipboard-write"
        loading="lazy">
        <p>Your browser does not support iframes. <a href="https://duck.tinyexams.com/">Click here to access.</a></p>
    </iframe>

</body>
</html>
