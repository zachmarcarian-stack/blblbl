<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentaries</title>
    <style>
        /* Zero margins and full viewport usage */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        /* Iframe styling for a seamless experience */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://watchdocumentaries.com/games/" 
        title="Educational Games"
        allow="fullscreen; autoplay; gamepad; keyboard"
        loading="lazy">
        <p>Your browser does not support iframes. <a href="https://watchdocumentaries.com/games/">View Documentaries</a>.</p>
    </iframe>

</body>
</html>
