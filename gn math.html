<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Workspace</title>
    <style>
        /* Removes all scrollbars and margins from the main page */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Makes the iframe fill the entire browser window */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://gn-math.dev/" 
        title="GN Math Hub"
        allow="fullscreen; autoplay"
        loading="lazy">
        <p>Your browser does not support iframes. Please visit <a href="https://gn-math.dev/">GN Math</a> directly.</p>
    </iframe>

</body>
</html>
