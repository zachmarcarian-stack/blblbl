<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Resources</title>
    <style>
        /* Ensures the window is fully utilized without scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f0f0f0;
        }

        /* Iframe fills the entire viewport */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://classroom-6x.io/home/" 
        title="Classroom Content"
        allow="fullscreen; autoplay; gamepad; keyboard"
        loading="lazy">
        <p>Your browser does not support iframes. <a href="https://classroom-6x.io/home/">Access site directly.</a></p>
    </iframe>

</body>
</html>
